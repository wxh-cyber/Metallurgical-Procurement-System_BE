server:
  port: 8080
spring:
  application:
    name: metallurgy-procurement
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/metallurgy_procurement?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.metallurgy: info
jwt:
  secret: ${JWT_SECRET:change-this-development-secret-to-a-long-random-value}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
